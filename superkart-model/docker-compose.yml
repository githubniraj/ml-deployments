version: '3.8'

services:
  backend:
    build:
      context: ./backend_files
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - PORT=7860

  frontend:
    build:
      context: ./frontend_files
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://host.docker.internal:7860
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
